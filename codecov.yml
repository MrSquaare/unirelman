coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  cli:
    paths:
      - packages/cli/
    carryforward: true
  core:
    paths:
      - packages/core/
    carryforward: true
  helpers:
    paths:
      - packages/helpers/
    carryforward: true
  plugin-changelog:
    paths:
      - plugins/changelog/
    carryforward: true
  plugin-changesets:
    paths:
      - plugins/changesets/
    carryforward: true
  plugin-replace:
    paths:
      - plugins/replace/
    carryforward: true
  plugin-semver:
    paths:
      - plugins/semver/
    carryforward: true
  utils:
    paths:
      - packages/utils/
    carryforward: true
