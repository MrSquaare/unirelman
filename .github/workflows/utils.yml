name: "@unirelman/utils"

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/utils/**"
      - "internals/shared-config/**"
      - "internals/testing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/actions/setup-env/**"
      - ".github/workflows/utils.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Checks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build
        run: pnpm build --filter @unirelman/utils

      - name: Typecheck
        run: pnpm typecheck --filter @unirelman/utils

      - name: Check
        run: pnpm check --filter @unirelman/utils

  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Test
        run: pnpm test --filter @unirelman/utils
