name: "Setup environment"
description: "Install pnpm, Node.js and the workspace dependencies"

inputs:
  registry-url:
    description: "npm registry for actions/setup-node to authenticate with the NODE_AUTH_TOKEN environment variable"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: "package.json"
        cache: "pnpm"
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
